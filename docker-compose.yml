services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesdb
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d salesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/salesdb
      DB_USERNAME: sales_user
      DB_PASSWORD: sales_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
